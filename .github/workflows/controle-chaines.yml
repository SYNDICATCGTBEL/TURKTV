name: Contrôle automatique des chaînes

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Contrôle à lancer"
        required: true
        default: full
        type: choice
        options:
          - full
          - priority

permissions:
  contents: write

concurrency:
  group: controle-chaines-turktv
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer la playlist
        uses: actions/checkout@v4

      - name: Choisir le niveau de contrôle
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 3 * * *" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=priority" >> "$GITHUB_OUTPUT"
          fi

      - name: Renouveler et contrôler les flux
        run: python automation/refresh_streams.py --mode "${{ steps.mode.outputs.value }}"

      - name: Publier uniquement une correction vérifiée
        shell: bash
        run: |
          if git diff --quiet -- turktv.m3u; then
            echo "Aucune adresse à renouveler."
            exit 0
          fi
          git config user.name "TURKTV Automatique"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- turktv.m3u
          git commit -m "Renouvelle les flux officiels [skip ci]"
          git push
